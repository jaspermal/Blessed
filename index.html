<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blessed">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Blessed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
      background: #fff; color: #000;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
    }
    textarea { -webkit-user-select: text; user-select: text; }
    .app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .content { flex: 1; overflow-y: auto; padding-bottom: 90px; }
    .screen { display: none; padding: 0 20px; padding-top: max(32px, env(safe-area-inset-top)); max-width: 480px; margin: 0 auto; width: 100%; }
    .screen.active { display: block; }

    /* Nav */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; border-top: 1px solid #E5E7EB; background: #fff; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 12px; border: none; background: none; color: #9CA3AF; font-size: 11px; font-weight: 600; font-family: inherit; }
    .nav button.active { color: #000; }
    .nav button svg { margin-bottom: 4px; }

    /* Date nav */
    .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .date-nav h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; text-align: center; }
    .date-nav .streak { font-size: 14px; color: #6B7280; margin-top: 2px; }
    .date-nav .back-link { font-size: 12px; color: #6B7280; text-decoration: underline; border: none; background: none; font-family: inherit; margin-top: 2px; }
    .arrow-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #E5E7EB; background: #fff; flex-shrink: 0; }
    .arrow-btn:disabled { opacity: 0.3; }

    /* Mood */
    .mood-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6B7280; margin-bottom: 4px; }
    .mood-row { display: flex; justify-content: center; gap: 16px; padding: 16px 0; }
    .mood-btn { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s; font-family: inherit; }
    .mood-btn span.emoji { font-size: 30px; }
    .mood-btn.selected span.emoji { font-size: 38px; }
    .mood-btn.dimmed { opacity: 0.25; }
    .mood-btn .mood-text { font-size: 11px; font-weight: 600; }

    /* Gratitude cards */
    .gratitude-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .gratitude-card .card-inner { display: flex; align-items: flex-start; gap: 12px; }
    .gratitude-card .card-content { flex: 1; }
    .gratitude-card label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6B7280; }
    .gratitude-card textarea { width: 100%; margin-top: 6px; border: none; background: transparent; resize: none; outline: none; font-size: 16px; line-height: 1.5; font-family: inherit; color: #000; }
    .gratitude-card textarea::placeholder { color: #D1D5DB; }

    /* Mic button */
    .mic-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E5E7EB; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 20px; position: relative; }
    .mic-btn.recording { border-color: #EF4444; background: #FEF2F2; }
    .mic-btn.recording::before { content: ''; position: absolute; width: 28px; height: 28px; border-radius: 50%; background: rgba(239,68,68,0.3); animation: pulse 1.2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }

    /* Save button */
    .save-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; font-family: inherit; margin-top: 8px; margin-bottom: 24px; }
    .save-btn.enabled { background: #000; color: #fff; }
    .save-btn.disabled { background: #E5E7EB; color: #9CA3AF; }

    /* Calendar */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .cal-header h2 { font-size: 18px; font-weight: 700; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-label { text-align: center; font-size: 12px; font-weight: 600; color: #6B7280; padding: 4px; }
    .cal-day { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; border-radius: 8px; border: 1px solid transparent; background: none; font-size: 14px; font-weight: 500; font-family: inherit; color: #000; }
    .cal-day.today { background: #F9FAFB; border-color: #E5E7EB; }
    .cal-day.selected { background: #000; color: #fff; }
    .cal-day.future { color: #D1D5DB; }
    .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }

    /* Day detail */
    .day-detail { margin-top: 16px; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 20px; }
    .day-detail .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .day-detail .detail-left { display: flex; align-items: center; gap: 8px; }
    .day-detail .detail-left .emoji { font-size: 24px; }
    .day-detail .detail-left .date { font-size: 14px; font-weight: 600; }
    .edit-btn { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid #E5E7EB; background: none; color: #6B7280; font-family: inherit; }
    .detail-item { display: flex; gap: 8px; margin-bottom: 8px; }
    .detail-item .num { font-size: 12px; color: #6B7280; margin-top: 2px; }
    .detail-item .text { font-size: 14px; line-height: 1.5; }
    .no-entry { text-align: center; color: #6B7280; font-size: 14px; padding: 20px; }
    .add-btn { margin-top: 8px; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid #E5E7EB; background: none; color: #000; font-family: inherit; }

    /* Settings */
    .settings-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    .settings-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .settings-card .card-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .settings-card .card-text { font-size: 14px; color: #6B7280; }
    .settings-card .card-small { font-size: 12px; color: #9CA3AF; line-height: 1.5; }
    .settings-card .card-label { font-size: 12px; font-weight: 600; color: #6B7280; margin-bottom: 8px; }
    .export-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #E5E7EB; background: #fff; font-size: 14px; font-weight: 700; font-family: inherit; margin-bottom: 12px; }
    .delete-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #FECACA; background: #fff; font-size: 14px; font-weight: 700; font-family: inherit; color: #EF4444; }

    /* Toast */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 999px; z-index: 50; animation: fadeUp 0.2s ease; white-space: nowrap; }
    @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="content">
      <div id="screen-today" class="screen active"></div>
      <div id="screen-calendar" class="screen"></div>
      <div id="screen-settings" class="screen"></div>
    </div>
    <div class="nav">
      <button class="active" data-tab="today">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        Vandaag
      </button>
      <button data-tab="calendar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Kalender
      </button>
      <button data-tab="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Instellingen
      </button>
    </div>
  </div>
  <div id="toast" class="toast" style="display:none"></div>

  <script>
    // ─── Constants ───
    const MOODS = [
      { emoji: "😢", label: "Awful", color: "#EF4444" },
      { emoji: "😕", label: "Bad", color: "#F97316" },
      { emoji: "😐", label: "Okay", color: "#EAB308" },
      { emoji: "😊", label: "Good", color: "#84CC16" },
      { emoji: "😄", label: "Great", color: "#22C55E" },
    ];
    const DAY_LABELS = ["Ma","Di","Wo","Do","Vr","Za","Zo"];
    const MONTHS = ["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];
    const WEEKDAYS = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];

    // ─── State ───
    let entries = {};
    let editingDate = new Date();
    let mood = null;
    let gratitude = ["", "", ""];
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedDay = null;
    let currentTab = "today";

    // ─── IndexedDB ───
    const DB_NAME = "blessed-journal";
    const STORE = "entries";

    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    async function dbSet(k, v) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
    async function dbGetAll() { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readonly"); const s = tx.objectStore(STORE); const keys = s.getAllKeys(); const vals = s.getAll(); tx.oncomplete = () => { const r = {}; keys.result.forEach((k, i) => r[k] = vals.result[i]); res(r); }; tx.onerror = () => rej(tx.error); }); }
    async function dbClear() { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

    // ─── Helpers ───
    function toKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function fmtDate(d) { return `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
    function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    function isToday() { return sameDay(editingDate, new Date()); }

    function getStreak() {
      let s = 0, d = new Date();
      if (!entries[toKey(d)]) d.setDate(d.getDate()-1);
      while (entries[toKey(d)]) { s++; d.setDate(d.getDate()-1); }
      return s;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.style.display = "none", 2500);
    }

    // ─── Speech ───
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let activeRec = null;
    let activeField = null;

    function toggleSpeech(index) {
      if (activeRec && activeField === index) {
        activeRec.stop(); activeRec = null; activeField = null;
        renderToday(); return;
      }
      if (activeRec) { activeRec.stop(); activeRec = null; }
      if (!SpeechRec) { showToast("Spraakherkenning niet beschikbaar"); return; }

      try {
        const rec = new SpeechRec();
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = "nl-NL";
        rec.onresult = (e) => {
          const txt = e.results[0][0].transcript;
          gratitude[index] = gratitude[index] ? gratitude[index] + " " + txt : txt;
          activeRec = null; activeField = null;
          renderToday();
        };
        rec.onerror = (e) => {
          activeRec = null; activeField = null;
          if (e.error === "not-allowed") showToast("Microfoon toegang geweigerd");
          else if (e.error === "no-speech") showToast("Geen spraak gedetecteerd");
          renderToday();
        };
        rec.onend = () => { activeRec = null; activeField = null; renderToday(); };
        rec.start();
        activeRec = rec; activeField = index;
        renderToday();
      } catch(e) { showToast("Spraakherkenning niet beschikbaar"); }
    }

    // ─── Render: Today ───
    function renderToday() {
      const streak = getStreak();
      const today = isToday();
      const hasContent = mood !== null || gratitude.some(g => g.trim());
      const existing = entries[toKey(editingDate)];

      let html = `<div class="date-nav">
        <button class="arrow-btn" onclick="prevDay()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div style="text-align:center">
          <h1>${fmtDate(editingDate)}</h1>
          ${today && streak > 0 ? `<div class="streak">🔥 ${streak} dagen streak</div>` : ""}
          ${!today ? `<button class="back-link" onclick="goToday()">Terug naar vandaag</button>` : ""}
        </div>
        <button class="arrow-btn" onclick="nextDay()" ${today ? "disabled" : ""}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>`;

      // Mood
      html += `<div class="mood-label">Hoe voel je je?</div><div class="mood-row">`;
      MOODS.forEach((m, i) => {
        const sel = mood === i;
        const dim = mood !== null && !sel;
        html += `<button class="mood-btn ${sel ? "selected" : ""} ${dim ? "dimmed" : ""}" onclick="setMood(${i})">
          <span class="emoji">${m.emoji}</span>
          ${sel ? `<span class="mood-text" style="color:${m.color}">${m.label}</span>` : ""}
        </button>`;
      });
      html += `</div>`;

      // Gratitude fields
      for (let i = 0; i < 3; i++) {
        const isRec = activeField === i;
        html += `<div class="gratitude-card"><div class="card-inner">
          <div class="card-content">
            <label>Dankbaar voor #${i+1}</label>
            <textarea rows="2" placeholder="Waar ben je dankbaar voor?" oninput="setGratitude(${i}, this.value)">${gratitude[i] || ""}</textarea>
          </div>
          <button class="mic-btn ${isRec ? "recording" : ""}" onclick="toggleSpeech(${i})">
            ${isRec
              ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="#EF4444"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`
              : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`
            }
          </button>
        </div></div>`;
      }

      html += `<button class="save-btn ${hasContent ? "enabled" : "disabled"}" onclick="saveEntry()" ${hasContent ? "" : "disabled"}>
        ${existing ? "Bijwerken" : "Opslaan"}
      </button>`;

      document.getElementById("screen-today").innerHTML = html;
    }

    // ─── Render: Calendar ───
    function renderCalendar() {
      const first = new Date(calYear, calMonth, 1);
      let startDow = first.getDay() - 1; if (startDow < 0) startDow = 6;
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();

      let html = `<div class="cal-header">
        <button class="arrow-btn" onclick="calPrev()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h2>${MONTHS[calMonth]} ${calYear}</h2>
        <button class="arrow-btn" onclick="calNext()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div><div class="cal-grid">`;

      DAY_LABELS.forEach(d => html += `<div class="cal-day-label">${d}</div>`);
      for (let i = 0; i < startDow; i++) html += `<div></div>`;

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(calYear, calMonth, d);
        const key = toKey(date);
        const entry = entries[key];
        const isTod = sameDay(date, today);
        const isSel = selectedDay && sameDay(date, selectedDay);
        const isFut = date > today;
        const cls = `cal-day ${isTod ? "today" : ""} ${isSel ? "selected" : ""} ${isFut ? "future" : ""}`;

        html += `<button class="${cls}" onclick="selectCalDay(${calYear},${calMonth},${d})" ${isFut ? "disabled" : ""}>
          ${d}
          ${entry ? `<div class="dot" style="background:${MOODS[entry.mood]?.color || "#6B7280"}"></div>` : ""}
        </button>`;
      }
      html += `</div>`;

      // Detail
      if (selectedDay) {
        const key = toKey(selectedDay);
        const entry = entries[key];
        if (entry) {
          html += `<div class="day-detail">
            <div class="detail-header">
              <div class="detail-left"><span class="emoji">${MOODS[entry.mood]?.emoji || ""}</span><span class="date">${fmtDate(selectedDay)}</span></div>
              <button class="edit-btn" onclick="editDay(${selectedDay.getFullYear()},${selectedDay.getMonth()},${selectedDay.getDate()})">Bewerken</button>
            </div>
            ${entry.gratitude.map((g, i) => `<div class="detail-item"><span class="num">${i+1}.</span><span class="text">${g || '<span style="color:#D1D5DB">—</span>'}</span></div>`).join("")}
          </div>`;
        } else {
          html += `<div class="day-detail"><div class="no-entry">Geen notitie voor deze dag<br><button class="add-btn" onclick="editDay(${selectedDay.getFullYear()},${selectedDay.getMonth()},${selectedDay.getDate()})">+ Toevoegen</button></div></div>`;
        }
      }

      document.getElementById("screen-calendar").innerHTML = html;
    }

    // ─── Render: Settings ───
    function renderSettings() {
      const count = Object.keys(entries).length;
      const streak = getStreak();

      document.getElementById("screen-settings").innerHTML = `
        <div class="settings-title">Instellingen</div>
        <div class="settings-card">
          <div class="card-title">Statistieken</div>
          <div class="card-text">${count} notities · ${streak > 0 ? "🔥 " + streak + " dagen streak" : "Nog geen streak"}</div>
        </div>
        <button class="export-btn" onclick="doExport('csv')">Exporteer als CSV</button>
        <button class="export-btn" onclick="doExport('json')">Exporteer als JSON</button>
        <div class="settings-card">
          <div class="card-label">Over</div>
          <div class="card-small">Spraakherkenning staat ingesteld op Nederlands (nl-NL). Data wordt lokaal opgeslagen op dit apparaat.</div>
        </div>
        <button class="delete-btn" onclick="clearAll()">Alles verwijderen</button>
      `;
    }

    // ─── Actions ───
    window.setMood = (i) => { mood = i; renderToday(); };
    window.setGratitude = (i, v) => { gratitude[i] = v; };
    window.prevDay = () => { const d = new Date(editingDate); d.setDate(d.getDate()-1); loadDate(d); };
    window.nextDay = () => { const d = new Date(editingDate); d.setDate(d.getDate()+1); if (d <= new Date()) loadDate(d); };
    window.goToday = () => loadDate(new Date());

    window.saveEntry = async () => {
      const key = toKey(editingDate);
      const data = { date: key, mood, gratitude: [...gratitude], updatedAt: new Date().toISOString() };
      try {
        await dbSet(key, data);
        entries[key] = data;
        showToast("Opgeslagen ✓");
        renderToday();
      } catch(e) { showToast("Opslaan mislukt"); }
    };

    window.selectCalDay = (y, m, d) => {
      const date = new Date(y, m, d);
      if (selectedDay && sameDay(date, selectedDay)) selectedDay = null;
      else selectedDay = date;
      renderCalendar();
    };

    window.editDay = (y, m, d) => { loadDate(new Date(y, m, d)); switchTab("today"); };
    window.calPrev = () => { if (calMonth === 0) { calMonth = 11; calYear--; } else calMonth--; selectedDay = null; renderCalendar(); };
    window.calNext = () => { if (calMonth === 11) { calMonth = 0; calYear++; } else calMonth++; selectedDay = null; renderCalendar(); };

    window.doExport = (fmt) => {
      const sorted = Object.keys(entries).sort();
      let content, filename, type;
      if (fmt === "csv") {
        const rows = [["date","mood","mood_label","grateful_1","grateful_2","grateful_3"]];
        sorted.forEach(k => { const e = entries[k]; rows.push([e.date, e.mood, MOODS[e.mood]?.label||"", `"${(e.gratitude[0]||"").replace(/"/g,'""')}"`, `"${(e.gratitude[1]||"").replace(/"/g,'""')}"`, `"${(e.gratitude[2]||"").replace(/"/g,'""')}"`]); });
        content = rows.map(r => r.join(",")).join("\n"); filename = "gratitude.csv"; type = "text/csv";
      } else {
        content = JSON.stringify(sorted.map(k => entries[k]), null, 2); filename = "gratitude.json"; type = "application/json";
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = filename; a.click();
      showToast(sorted.length + " notities geëxporteerd");
    };

    window.clearAll = async () => {
      if (!confirm("Alle notities verwijderen? Dit kan niet ongedaan worden.")) return;
      try { await dbClear(); entries = {}; mood = null; gratitude = ["","",""]; showToast("Alles verwijderd"); renderToday(); }
      catch(e) { showToast("Verwijderen mislukt"); }
    };

    function loadDate(d) {
      editingDate = d;
      const entry = entries[toKey(d)];
      if (entry) { mood = entry.mood; gratitude = [...entry.gratitude]; }
      else { mood = null; gratitude = ["","",""]; }
      renderToday();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + tab).classList.add("active");
      document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      if (tab === "today") { loadDate(editingDate); }
      if (tab === "calendar") renderCalendar();
      if (tab === "settings") renderSettings();
    }

    // Nav clicks
    document.querySelectorAll(".nav button").forEach(b => {
      b.addEventListener("click", () => switchTab(b.dataset.tab));
    });

    // ─── Init ───
    (async () => {
      try { entries = await dbGetAll(); } catch(e) { console.error(e); }
      const todayEntry = entries[toKey(new Date())];
      if (todayEntry) { mood = todayEntry.mood; gratitude = [...todayEntry.gratitude]; }
      renderToday();
    })();

    // Service worker
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  </script>
</body>
</html>
